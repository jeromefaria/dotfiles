# Home Mirror Configuration
#
# A set-and-forget nightly LOCAL mirror to the re-shelled EVO SSD — a
# defense-in-depth layer alongside Time Machine (X9). Unlike TM, this is a
# plain rsync file copy: browsable and restorable on any Mac, no TM dependency.
# Sourced by home-mirror-sync.sh and home-mirror-manage.sh.
#
# Scope philosophy: NOT a full-disk clone. It captures (a) your personal
# working data and (b) the FULL audio-rig state, which the 2026-07-30 manifest
# cross-check proved is scattered across FIVE locations. Dev is already covered
# by dotfiles(git)+TM; the Audio drive by rclone -> Google Drive.
#
# For audio the model "fails toward inclusion" — an audio-vendor allow-list is
# untenable at ~60 vendors, so ~/Library/Application Support is mirrored whole
# minus a non-audio deny-list. Total footprint ~= 102 GB (sizes from 2026-07-30).

# ─── Destination (the re-shelled EVO) ──────────────────────────────────
DEST_VOLUME="Mirror"                                          # APFS name to give the EVO at setup
DEST_ROOT="/Volumes/${DEST_VOLUME}/home-mirror"               # live mirror lands here
VERSIONS_ROOT="/Volumes/${DEST_VOLUME}/home-mirror-versions"  # dated --backup-dir tree (overwritten/deleted files)
SENTINEL="/Volumes/${DEST_VOLUME}/.home-mirror-dest"          # mount-gate marker (created at setup; sync skips if missing)
VERSION_RETENTION_DAYS=90                                     # prune version folders older than this

# ─── Wholesale-mirror roots  ("SOURCE|DEST_SUBDIR") ────────────────────
# Each entry is copied in full (minus MIRROR_EXCLUDES below).
MIRROR_ROOTS=(
  # — Personal working data —
  "${HOME}/Work|Work"                                                   # 14 GB — active work
  "${HOME}/Documents|Documents"                                         # 2.2 GB
  "${HOME}/Desktop|Desktop"                                             # ~0
  "${HOME}/Movies|Movies"                                               # 1.6 GB
  "${HOME}/Pictures|Pictures"                                           # 1.5 GB — REVIEW: drop if Photos is iCloud-synced (already offsite)

  # — Audio: user-level state / prefs / FILE-BASED LICENSES —
  "${HOME}/Library/Preferences|user/Library-Preferences"               # 868 MB — 115 iZotope *.Authorizations.plist, Focusrite FAST + Ableton prefs, library-path pointers ("the actual rebuild work")
  "${HOME}/Library/Audio|user/Library-Audio"                           # 630 MB — user MIDI, AU presets, user Apple Loops
  "${HOME}/Music/Ableton|user/Music-Ableton"                           # 256 KB — Ableton User Library/prefs (sessions live on the Audio drive)
  "${HOME}/Library/Two notes Audio Engineering|user/Library-TwoNotes"  # Two Notes (lives in ~/Library directly, not App Support)

  # — Audio: plugin binaries (MANDATORY — un-redownloadable FAST Suite & Experiverb live here) —
  "/Library/Audio/Plug-Ins|system/Library-Audio-PlugIns"               # 42 GB — AU/VST/VST3. NOT optional (see manifest "Critical reinstall risks")
  "/Library/Application Support/Avid/Audio/Plug-Ins|system/Avid-AAX"    # 1.9 GB — AAX (Pro Tools); drop if unused

  # — Audio: system-level vendor app data (real dirs; iZotope & Softube are symlinks -> Audio drive, so NOT listed) —
  "/Library/Application Support/Universal Audio|system/UniversalAudio"          # 2.5 GB
  "/Library/Application Support/Toontrack|system/Toontrack"                     # 882 MB
  "/Library/Application Support/Steinberg|system/Steinberg"                     # 237 MB
  "/Library/Application Support/Celemony|system/Celemony"                       # 190 MB
  "/Library/Application Support/GForce|system/GForce"                           # 95 MB
  "/Library/Application Support/Applied Acoustics Systems|system/AAS"           # 83 MB

  # — Audio: /Users/Shared content (audio dirs only; migration cruft excluded) —
  "/Users/Shared/AudioThing|shared/AudioThing"                         # 4.6 GB
  "/Users/Shared/NI Resources|shared/NI-Resources"                     # 151 MB
  "/Users/Shared/Native Instruments|shared/NativeInstruments"          # 51 MB
  "/Users/Shared/Max 7|shared/Max7"                                    # 42 MB
)

# ─── ~/Library/Application Support — mirrored WHOLE minus this deny-list ─
# Fail toward inclusion: every audio vendor (present or future) is captured;
# only confident non-audio is excluded. Adding a wrong exclusion loses audio,
# so keep this conservative. Wildcards allowed (rsync patterns).
USER_APPSUPPORT_SRC="${HOME}/Library/Application Support"
USER_APPSUPPORT_DEST="user/Library-AppSupport"
USER_APPSUPPORT_EXCLUDE=(
  # Apple / system daemons & stores
  "com.apple.*"  "Caches"  "CloudDocs"  "iCloud"  "MobileSync"  "Knowledge"
  "AddressBook"  "CallHistory*"  "CrashReporter"  "DiskImages"  "FileProvider"
  "SyncServices"  "Dock"  "ControlCenter"  "System Preferences"  "Spotlight"
  "Quick Look"  "com.apple*"  "*.settings.plist"
  # Browsers
  "Arc"  "BraveSoftware"  "Chromium"  "Comet"  "Firefox"  "Google"  "Mozilla"
  "Microsoft Edge*"  "com.operasoftware.Opera"  "TorBrowser-Data"  "Vivaldi*"  "zen"
  # Chat / comms / non-production media
  "BeeperTexts"  "BetterDiscord*"  "discord"  "Signal"  "Skype*"  "Slack"
  "WhatsApp"  "zoom.us"  "ZoomUpdater"  "TIDAL"  "Last.fm"  "com.colliderli.iina"
  "Twitch Studio"  "com.snap.SnapCamera"
  # AI / dev tooling
  "Claude*"  "com.openai.chat"  "Grammarly*"  "com.grammarly*"  "Cursor"  "Code"
  "Zed"  "JetBrains"  "Android*"  "AndroidStudio*"  "Java"  "JREInstaller"  "Oracle"
  "Postman"  "Pluralsight"  "go"  "dmd"  "QtProject"  "spacedrive"  "Sequel Pro"
  "lazygit"  "zoxide"  "VimR"  "kindaVim"  "com.mitchellh.ghostty"  "Hyper"  "iTerm2"
  "Kopsik"  "com.kapeli.dashdoc"  "Dash"
  # Games
  "American Truck Simulator"  "Battle.net"  "Epic"  "Hacknet"  "Steam"
  # Cloud / utilities / other big non-audio
  "1Password"  "Adobe"  "Alfred"  "balena*"  "Bartender*"  "com.surteesstudios*"
  "com.bohemiancoding.sketchtool"  "CleanMyMac*"  "DropboxElectron"  "Figma"  "GIMP"
  "Godot"  "HyperSwitch"  "KensingtonWorks"  "Many Tricks"  "Mega Limited"  "NordVPN"
  "com.nordvpn.macos"  "Notion"  "obsidian"  "obs-studio"  "com.raycast*"
  "Rectangle Pro"  "Routine"  "com.sindresorhus.Supercharge"  "TagSpaces"
  "com.culturedcode.ThingsMac"  "Things Sandbox Helper"  "Topaz Labs LLC"
  "com.tupil.beamer"  "Witch"  "com.lwouis.alt-tab-macos"  "com.dmitrynikolaev.numi"
  "Numi"  "Raindrop.io"  "Welcome to DaVinci Resolve"  "Blackmagic Design"
  "Derivative"  "AnkerWork"  "Stream Media to Samsung TV"  "Cypress"
  "com.sandisk.softwareInstaller"  "org.yanex.marta"  "org.musicbrainz.Picard"
  "Audiokinetic"  "Wwise*"  "WwiseLauncher"
)

# ─── Global excludes (junk / regeneratable, applied to every root above) ─
MIRROR_EXCLUDES=(
  ".DS_Store"
  "._*"
  ".Trash"
  "*.tmp"
  "node_modules"                 # dev deps in Work repos — regenerate from lockfiles
  "Cache"  "Caches"              # any cache subdir at any depth
  "*.asd"                        # Ableton analysis files (rebuilt on open)
  "Previously Relocated Items*"  # macOS migration cruft (seen under /Users/Shared)
)

# ─── Deliberately NOT mirrored (covered better elsewhere) ──────────────
#   ~/dotfiles                       -> git + GitHub (offsite) + TM
#   ~/Downloads                      -> re-downloadable
#   ~/.volta ~/.cargo ~/.npm ...     -> dev toolchains, regeneratable + TM
#   /Volumes/Audio (projects, libs)  -> rclone -> Google Drive nightly (audio-backup)
#   /Library/Application Support/{iZotope,Softube} -> symlinks INTO the Audio drive; already rclone'd
#   ~/Library/Mobile Documents       -> iCloud Drive (already offsite)
#   iLok / account-based licenses    -> re-auth via managers + ownership manifest
#                                       (NOTE: iZotope auth IS file-based -> captured via ~/Library/Preferences)

# ─── Schedule (launchd) ────────────────────────────────────────────────
SCHEDULE_HOUR=4          # 04:00 — offset from audio-backup's 03:00 so they don't overlap
SCHEDULE_MINUTE=0

# ─── Staleness / health (set-and-forget must announce when it stops) ───
MAX_STALE_HOURS=48       # flag if no successful mirror completed within this window

# ─── Files & logs ──────────────────────────────────────────────────────
LOG_DIR="${HOME}/Library/Logs/home-mirror"
LOG_FILE_PATTERN="home-mirror-%Y-%m-%d.log"

# ─── launchd ───────────────────────────────────────────────────────────
LAUNCHD_LABEL="com.jeromefaria.homemirror"
LAUNCHD_PLIST="${HOME}/Library/LaunchAgents/${LAUNCHD_LABEL}.plist"
