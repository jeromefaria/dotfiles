# Audio Volume Guard Configuration
#
# Single source of truth for audio-volume-guard.sh. See scripts/README.md for
# the failure mode this guards against.
#
# Assignments use `: "${VAR:=value}"` rather than plain `VAR=value` so an
# already-exported environment variable wins. That is what lets the test suite
# drive the guard against a sandboxed mount point without editing this file —
# and it means a one-off override on the command line behaves as expected:
#
#   AUDIO_VOLUME_MOUNT=/Volumes/AudioB audio-volume-guard.sh --status

# ─── The volume being guarded ──────────────────────────────────────────
: "${AUDIO_VOLUME_MOUNT:=/Volumes/Audio}"
: "${AUDIO_VOLUME_LABEL:=Audio}"

# Mount-gate marker, same idea as home-mirror.conf's SENTINEL. A matching
# st_dev only proves *something* is mounted here — a USB stick or disk image
# named "Audio" satisfies that test just as well as the real drive, and an
# installer writing to the wrong disk is exactly what this guard exists to
# prevent. Identity is therefore pinned to a marker file created on the real
# volume by `audio-volume-guard.sh --init`; without it the guard reports
# `unverified` and the installer pre-flight fails closed.
: "${AUDIO_VOLUME_SENTINEL:=${AUDIO_VOLUME_MOUNT}/.audio-volume-guard}"

# ─── Notifications ─────────────────────────────────────────────────────
: "${AUDIO_VOLUME_NOTIFY_ENABLED:=1}"                  # 0 to silence all notifications
: "${AUDIO_VOLUME_NOTIFIER_GROUP:=audio-volume-guard}" # terminal-notifier group; new alert replaces prior one
: "${AUDIO_VOLUME_NOTIFY_COOLDOWN_HOURS:=1}"           # don't re-fire within this window

# ─── Files & logs ──────────────────────────────────────────────────────
: "${AUDIO_VOLUME_LOG_DIR:=${HOME}/Library/Logs/audio-volume-guard}"
# Cooldown marker lives OUTSIDE the log dir because ~/Library/Logs is a
# favourite target of disk cleaners — same reasoning as tm-backup.conf.
: "${AUDIO_VOLUME_STATE_DIR:=${HOME}/Library/Application Support/audio-volume-guard}"

# ─── launchd ───────────────────────────────────────────────────────────
: "${AUDIO_VOLUME_LAUNCHD_LABEL:=com.jeromefaria.audiovolumeguard}"
