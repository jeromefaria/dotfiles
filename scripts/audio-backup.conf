# Audio Backup Configuration
#
# Single source of truth for the rclone-based Audio drive → Google Drive sync.
# Both audio-backup-sync.sh and audio-backup-manage.sh source this file.
# Edit values here when anything moves; scripts pick up automatically.

# ─── Source ────────────────────────────────────────────────────────────
SOURCE="/Volumes/Audio/Audio"
SENTINEL="${SOURCE}/SYSTEM.md"            # mount-check: if this file isn't here, drive isn't mounted

# ─── Destination ───────────────────────────────────────────────────────
# rclone remote name (configured via `rclone config`)
RCLONE_REMOTE="drive"

# Path INSIDE the remote — change this if Drive layout moves later
RCLONE_DEST_PATH="Backup/Audio"

# Versioning destination: rclone moves overwritten/deleted files here under a dated subfolder
RCLONE_VERSIONS_PATH="Backup/Audio-versions"

# Version retention: prune Audio-versions/<date> folders older than this many
# days — by the folder's DATE (not file mtime), so "90d" means "90 days of
# history". Enforced by `audio-backup prune`, auto-run after each nightly sync.
VERSION_RETENTION_DAYS=90

# ─── Network gates ─────────────────────────────────────────────────────
# Allowlist of Wi-Fi router IPs where automatic backup is permitted.
#
# Why IPs instead of SSIDs? macOS Tahoe redacts the SSID/BSSID from every
# user-space API (`ipconfig`, `networksetup`, `system_profiler`) unless the
# binary holds a Location Services entitlement. The router IP is exposed by
# `networksetup -getinfo Wi-Fi` without any permission. Both 2.4 GHz and
# 5 GHz networks share the same router IP, so a single entry usually covers
# both bands of a home/studio setup.
#
# To find your router IP right now:
#   networksetup -getinfo Wi-Fi | awk -F': ' '/^Router:/{print $2}'
#
# Add additional trusted networks (other studios, family, etc.) by appending.
TRUSTED_ROUTER_ALLOWLIST=(
  "192.168.1.254"
)

# iPhone Personal Hotspot router prefix (prefix-match — hotspots issue
# addresses from 172.20.10.0/28 with the iPhone as gateway).
HOTSPOT_GATEWAY_PATTERN="172.20.10."

# ─── Performance ───────────────────────────────────────────────────────
BWLIMIT_DEFAULT="100M"                    # rclone --bwlimit on trusted router
BWLIMIT_FORCE="20M"                       # rclone --bwlimit when --force on untrusted/hotspot (after warn+confirm)

# Concurrency. Deliberately modest: the Audio drive sits behind a nested USB
# hub chain on a DisplayLink dock, sharing the bus with two 1440p DisplayLink
# streams and a 4K capture device. On a contended bus, high parallelism does
# not buy throughput — it buys stalls, timeouts and dropped devices, and
# lowering it often raises the *net* rate. Raise only if the drive gets its
# own controller (e.g. a Thunderbolt dock).
RCLONE_TRANSFERS=2                        # parallel file transfers
RCLONE_CHECKERS=4                         # parallel metadata checks (dominates the scan phase)

# ─── Resilience ────────────────────────────────────────────────────────
# A flaky bus drops the source volume mid-run. rclone is idempotent, so a
# second pass simply finishes what the first dropped — but only retry when the
# source is actually back, otherwise we just burn another failing run.
SYNC_RETRY_ATTEMPTS=1                     # extra whole-sync attempts after a failure (0 disables)
SYNC_RETRY_DELAY_SECONDS=30               # settle time before retrying

# Pre-flight read probe: lists the source's top level before committing to a
# long run, so a sick bus surfaces in seconds rather than ten minutes in. The
# listing goes through rclone on purpose — rclone is the binary macOS has
# granted access to the volume, so this probes the permission the transfer
# actually uses. Probing with a shell `find` instead tested /bin/bash's access,
# which was never granted, and silently failed every scheduled run from
# 2026-10-03 to 2026-10-19 while blaming the drive. 0 disables.
PREFLIGHT_PROBE_ENABLED=1
PROBE_TIMEOUT_SECONDS=120

# Recovery for a probe failure the script classifies as "unreadable": the
# volume is mounted but its bus endpoint is wedged, so cycling the mount can
# re-establish it. The volume is FileVault-encrypted, so it relocks the instant
# it is unmounted and has to be unlocked again from the Keychain;
# SOURCE_VOLUME_UUID is both the volume UUID and the name of the Keychain item
# holding its passphrase.
#
# Caveat on the fault this targets: a wedged bus is plausible on this dock but
# has never actually been observed here. It was inferred from a probe failure
# that turned out to be a macOS permission denial (see PREFLIGHT_PROBE_ENABLED),
# and the remount "recovery" ran pointlessly every night for three nights
# because of it. A denial now skips recovery outright, so this path only fires
# on a failure that is genuinely not about permissions — which may be never.
# Treat it as unproven until a log shows it recovering something real.
RECOVER_SOURCE_ON_PROBE_FAILURE=1
SOURCE_VOLUME_MOUNT="/Volumes/Audio"
SOURCE_VOLUME_UUID="39213B33-47CE-468D-A048-AD80752D5DDE"
SOURCE_REMOUNT_SETTLE_SECONDS=10

# Recovery runs unattended at 03:00, so every step is bounded: a wedged bus can
# make diskutil block with no timeout of its own, and the Keychain read opens a
# GUI prompt unless that item's ACL already trusts `security` — one dialog
# nobody answers would otherwise hang the run all night holding the lock.
#
# The remount only falls back to reading the passphrase when macOS declines to
# mount the volume from the key it already remembers — which is always, since an
# unmount relocks it. Confirmed working unattended: the 2026-10-17..19 03:00
# runs each unmounted, got the expected 0x4D "locked" refusal, read the
# passphrase from the Keychain and remounted, with no prompt and no timeout.
RECOVERY_STEP_TIMEOUT_SECONDS=60
KEYCHAIN_READ_TIMEOUT_SECONDS=10

# Time Machine runs hourly against a destination on the SAME dock. Two heavy
# jobs on one USB tree is how both of them fail, so defer rather than compete.
# The nightly run will be retried by launchd on its next fire.
DEFER_WHILE_TIME_MACHINE_RUNS=1

# ─── Schedule ──────────────────────────────────────────────────────────
# Used by `audio-backup-manage wizard --setup` to generate the launchd plist.
# 24-hour clock.
SCHEDULE_HOUR=3
SCHEDULE_MINUTE=0

# The agent also fires whenever the Audio volume's root changes (the WatchPaths
# block in audio-backup-manage.sh), so a run missed while the drive was away
# catches up the moment it returns rather than waiting a full day for the next
# scheduled fire. Mounts, ejects and the recovery remount above all churn that
# path, so an unattended run that finds a success newer than this window just
# exits: at most one real sync per window, however often the agent is woken.
# A manual run, and any run with --force, ignores it.
MIN_RESYNC_INTERVAL_HOURS=6

# ─── Files & logs ──────────────────────────────────────────────────────
# Resolved relative to this config file by the scripts. Override here with absolute paths if you move them.
DOTFILES_SCRIPTS_DIR="${HOME}/dotfiles/scripts"
FILTERS_FILE="${DOTFILES_SCRIPTS_DIR}/audio-backup-filters.txt"

LOG_DIR="${HOME}/Library/Logs/audio-backup"
LOG_FILE_PATTERN="audio-backup-%Y-%m-%d.log"     # date-formatted per-run logfile

# ─── Alerting ──────────────────────────────────────────────────────────
# A backup that fails silently is worse than none — you think you're covered.
# Surfaces both failure modes via a macOS notification:
#   • hard failure — rclone exits non-zero (e.g. lost Full Disk Access after a
#                    macOS update, network error)
#   • staleness    — no SUCCESSFUL run within STALE_ALERT_DAYS, which also
#                    catches the "fires nightly but silently skips" mode
#                    (drive unmounted, untrusted network) that exits 0.
# Posts via terminal-notifier (falls back to osascript). To make these STAY ON
# SCREEN until dismissed, set the notifier's style to "Alerts" (not "Banners")
# in System Settings → Notifications — for "terminal-notifier" (or "Script
# Editor" if the osascript fallback is used). Either style also persists the
# alert in Notification Center until cleared.
NOTIFY_ENABLED=1                                  # 0 to silence all notifications
STALE_ALERT_DAYS=3                                # alert if no successful backup within N days
# Persistent state (last-success stamp, cooldown marker) lives OUTSIDE the
# log dir because ~/Library/Logs/ is a favourite target of disk cleaners
# (mole cleared this dir ~monthly, silently defeating the staleness alerter).
# ~/Library/Application Support is left alone by every cleaner tested.
STATE_DIR="${HOME}/Library/Application Support/audio-backup"
LAST_SUCCESS_FILE="${STATE_DIR}/last-success"     # epoch stamp written on each successful sync
STALE_NOTIFY_COOLDOWN_HOURS=12                    # don't re-fire the staleness alert within this window
NOTIFIER_GROUP="audio-backup"                     # terminal-notifier group id — a new alert replaces the prior one

# ─── Live regeneratables (excluded from pull/push) ─────────────────────
# Ableton Live's per-session cache directories (regenerated on next open)
# and macOS file-system metadata. Single source of truth: the pull and
# push paths in audio-backup-manage.sh build their tool-specific flag
# arrays from these arrays.
#
# audio-backup-filters.txt (used by the nightly rclone --filter-from) is
# GENERATED from these arrays — run `audio-backup regenerate-filters` after
# editing, so there is a single source of truth (no hand-syncing).
LIVE_JUNK_DIRS=(
  "Analysis Files"
  "Autosaves"
  "Backup"
  "Undo"
  "Freeze"
)
LIVE_JUNK_GLOBS=(
  "*.asd"
  ".DS_Store"
  "._*"
)

# Top-level folders included in the backup (everything else is excluded).
SCOPE_INCLUDE=(
  "SYSTEM.md"
  "Documents/**"
  "Releases/**"
  "Recordings/**"
  "Projects/**"
)
# Extra macOS filesystem clutter (beyond .DS_Store / ._* already in LIVE_JUNK_GLOBS).
MACOS_CLUTTER=(
  "Icon?"
  ".Trashes/**"
  ".Spotlight-V100/**"
  ".fseventsd/**"
)

# ─── launchd ───────────────────────────────────────────────────────────
LAUNCHD_LABEL="com.jeromefaria.audiobackup"
LAUNCHD_PLIST="${HOME}/Library/LaunchAgents/${LAUNCHD_LABEL}.plist"
