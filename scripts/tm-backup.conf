# Time Machine Backup Configuration
#
# Single source of truth for the exclusion set and the fast-backup runner.
# Sourced by tm-exclusions.sh and tm-fast-backup.sh. See time-machine.md for
# the rationale (disk-sizing math + the 2026-07 disk profile these came from).

# ─── Fast-backup tuning ────────────────────────────────────────────────
# backupd runs at throttled low-priority I/O by default. tm-fast-backup.sh
# flips this knob to 0 for the duration of a backup (the biggest single
# speedup for a slow/HDD destination or a large initial full backup), then
# restores it. Verified present on macOS Tahoe (26). A reboot also resets it.
LOWPRI_THROTTLE_SYSCTL="debug.lowpri_throttle_enabled"

# ─── Exclusions ────────────────────────────────────────────────────────
# Regeneratable / re-downloadable paths kept OUT of Time Machine so the
# backup footprint stays well under the destination size — Time Machine wants
# the disk at >=1.5x the footprint to keep a healthy chain of history instead
# of thrashing and forcing a fresh full backup.
#
# These are "Tier 1": zero-downside, everything here rebuilds or re-downloads.
# NOTE: /Applications (~79 GB) is deliberately NOT excluded — kept for a
# full-fidelity restore now that the destination is a 1 TB disk. Only exclude
# it if you fall back to a destination smaller than ~1.5x the footprint.
#
# Apply with `tm-exclusions apply` (sticky: `tmutil addexclusion -p`, which
# survives the path being recreated and re-applies cleanly after a disk swap).
# Sizes are from the 2026-07 profile.
TM_EXCLUSIONS=(
  "/opt/homebrew"                                          # ~20 GB — reinstall via brew
  "${HOME}/Downloads"                                      # ~12 GB — re-downloadable
  "/Library/Developer"                                     # ~8 GB  — Xcode / CommandLineTools
  "${HOME}/Library/Application Support/Plex Media Server"  # ~5 GB  — rebuilds from the library
  "${HOME}/Library/Caches"                                 # ~4 GB  — user caches
  "${HOME}/Library/Application Support/Caches"             # ~1 GB  — app caches
  "/Library/Ruby"                                          # ~3.5 GB — system ruby gems
  "${HOME}/.volta"                                         # node toolchain (regeneratable)
  "${HOME}/.cache"                                         # generic tool cache
  "${HOME}/.rbenv"                                         # ruby toolchain
  "${HOME}/.cargo"                                         # rust toolchain
  "${HOME}/.npm"                                           # npm cache
  "${HOME}/.yarn"                                          # yarn cache
)
