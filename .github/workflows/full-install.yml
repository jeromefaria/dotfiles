# The install nothing else runs: packages included.
#
# ci.yml's fresh-install job passes --skip-packages, because installing the
# work profile's 147 formulae and casks takes longer than everything else in
# CI put together, and a push gate that slow stops being used. The package
# step is the one that was broken for months without anyone noticing — bare
# `brew bundle install` in a directory holding no Brewfile — so leaving it
# entirely unexercised is not an option either.
#
# Hence: weekly, and on demand. Not a push gate. A failure here is a report,
# not a block, and it is expected to be flaky in a way the other jobs are not
# — upstream casks move, download mirrors go down, Homebrew changes its own
# behaviour. Read a red run here as "go and look", not "the repo is broken".

name: Full install

on:
  schedule:
    # Two entries, one profile each: Mondays work, Thursdays personal. One
    # entry cannot cover both, and picking either as *the* weekly profile
    # leaves the other uninstalled — which is how the personal layout came to
    # be the shape this repo runs on and the one shape nothing ever installed.
    #
    # They are separate runs rather than one longer one because the two
    # installs are genuinely different sizes: work resolves to 144 packages,
    # personal to 326 (it maps to the `full` package profile, not a `personal`
    # one — see install_packages in scripts/install.sh). Doubling up would put
    # 470 packages behind a single timeout.
    #
    # 05:17 for no reason beyond staying off the hour everything else runs on.
    - cron: '17 5 * * 1'
    - cron: '17 5 * * 4'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Which profile to install'
        required: false
        default: 'work'
        type: choice
        options: [work, personal]

jobs:
  install:
    name: Install the ${{ github.event.inputs.profile || (github.event.schedule == '17 5 * * 4' && 'personal' || 'work') }} profile
    runs-on: macos-latest
    # 120 rather than 90: the personal profile installs 326 packages against
    # work's 144, and the bound has to fit the larger of the two runs.
    timeout-minutes: 120
    # A manual dispatch says which profile it wants; a scheduled run is
    # identified by which cron expression fired. Resolved once here so the
    # install step and the layout assertion cannot disagree about it.
    env:
      PROFILE: ${{ github.event.inputs.profile || (github.event.schedule == '17 5 * * 4' && 'personal' || 'work') }}
    steps:
      - uses: actions/checkout@v7

      - name: Record what was already here
        run: |
          # A runner arrives with Homebrew and a pile of preinstalled packages,
          # so "did it install?" has to be read against this baseline rather
          # than against an empty machine.
          brew list --formula | sort > "$RUNNER_TEMP/before-formula.txt"
          brew list --cask 2>/dev/null | sort > "$RUNNER_TEMP/before-cask.txt"
          echo "formulae: $(wc -l < "$RUNNER_TEMP/before-formula.txt" | tr -d ' ')"
          echo "casks:    $(wc -l < "$RUNNER_TEMP/before-cask.txt" | tr -d ' ')"

      - name: Install, packages and all
        run: |
          # --skip-macos stays: the 192 `defaults write` calls are covered by
          # test-macos-dry-run.sh, and applying them to a VM about to be
          # destroyed proves nothing. Everything else runs.
          ./scripts/install.sh --yes --profile "$PROFILE" --skip-macos \
            2>&1 | tee "$RUNNER_TEMP/install.log"

      - name: The link layout matches the profile
        run: |
          set -e
          # The reason this job now runs both profiles. Every other check here
          # is profile-agnostic, so until this step existed a personal run and
          # a work run asserted exactly the same things — and the personal
          # layout, which is the one this repo is actually used on, had never
          # been installed anywhere outside a mktemp sandbox.
          #
          # The hermetic cover is test-install-symlink.sh TESTs 8-10 and
          # test-install-profile.sh TEST 4. What they cannot reach is a real
          # $HOME on a machine that has never seen these dotfiles: a runner
          # arrives with a real ~/.config already created by Homebrew and gh,
          # so the personal path has to displace it for real, back it up for
          # real, and leave every tracked config reachable through one link.
          if [ "$PROFILE" = personal ]; then
            test -L "$HOME/.config" \
              || { echo "::error::~/.config is not a symlink after a personal install"; exit 1; }

            target=$(readlink "$HOME/.config")
            test "$target" = "$GITHUB_WORKSPACE/config" \
              || { echo "::error::~/.config points at $target, not the repo's config/"; exit 1; }

            # The full tracked set, not a sample: the whole point of one link
            # is that no hand-maintained list can fall behind the tree. neomutt
            # and tmuxinator are in-repo relative symlinks pointing back out of
            # config/, which is why they resolve through this link too.
            # A glob rather than `ls`, so a name with a space cannot split
            # into two entries that both look absent. config/ holds no
            # dot-entries, tracked or otherwise, so * is the whole set.
            missing=""
            reachable=0
            for path in "$GITHUB_WORKSPACE"/config/*; do
              c=${path##*/}
              if [ -e "$HOME/.config/$c" ] || [ -L "$HOME/.config/$c" ]; then
                reachable=$((reachable + 1))
              else
                missing="$missing $c"
              fi
            done
            if [ -n "$missing" ]; then
              echo "::error::unreachable through the link:$missing"
              exit 1
            fi
            echo "whole-directory link live; $reachable of the repo's configs reachable"
          else
            test ! -L "$HOME/.config" \
              || { echo "::error::~/.config is a symlink; work must link per item"; exit 1; }
            for c in nvim bat gh starship.toml atuin git vifm; do
              test -L "$HOME/.config/$c" \
                || { echo "::error::$c is not an individual symlink"; exit 1; }
            done
            echo "per-item links live"
          fi

      - name: Did the packages actually land?
        run: |
          set -e
          brew list --formula | sort > "$RUNNER_TEMP/after-formula.txt"
          added=$(comm -13 "$RUNNER_TEMP/before-formula.txt" "$RUNNER_TEMP/after-formula.txt" | wc -l | tr -d ' ')
          echo "formulae added: $added"

          # The tools the shell aliases depend on are the ones whose absence is
          # actually felt, so assert on those by name rather than on a count
          # that shifts with whatever the runner image happens to ship.
          missing=""
          for tool in eza bat fd sd zoxide rg git zsh; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::these never arrived:$missing"
            exit 1
          fi
          echo "every alias-backing tool is present"

      - name: Does the installed shell work?
        run: |
          set -e
          warnings=$(zsh -i -c exit 2>&1 | grep -i 'not found' || true)
          if [ -n "$warnings" ]; then
            echo "::error::shell start emitted warnings:"
            echo "$warnings"
            exit 1
          fi
          # With packages present the aliases exist, which is the difference
          # between this job and ci.yml's.
          zsh -i -c 'alias ls' >/dev/null
          zsh -i -c 'alias cat' >/dev/null
          echo "shell starts clean and the aliases are live"

      - name: macOS settings, dry run only
        run: |
          # Proves the modules parse and route under a profile selection
          # without touching a single preference.
          ./scripts/macos-setup.sh --dev --dry-run 2>&1 | tail -20

      - name: Install what the suites need but no profile installs
        run: |
          # rclone is deliberately absent from every Brewfile: its remote needs
          # an interactive `rclone config` OAuth round trip, so audio-backup
          # gates on it at runtime and scripts/audio-backup.md tells the user to
          # install it by hand. test-audio-backup.sh drives real rclone against
          # a `type = local` remote, so this job has to supply it — installing
          # the full profile is not the same as satisfying the test harness,
          # which is what the first run of this workflow discovered.
          brew install rclone

      - name: Every suite, against a fully installed machine
        # A per-step bound, so a hung suite names itself. The first run of this
        # workflow spent 81 of its 90 minutes inside one notification call and
        # all the job could report was "cancelled".
        timeout-minutes: 25
        run: |
          set -e
          scripts/test-install-symlink.sh
          scripts/test-install-seed-templates.sh
          scripts/test-install-profile.sh
          scripts/test-health-check.sh
          scripts/test-macos-dry-run.sh
          scripts/test-notify.sh
          scripts/test-audio-backup.sh
          scripts/test-audio-volume-guard.sh
          scripts/test-tm-backup-staleness.sh
          mail/scripts/test-manage-sync.sh
          python3 scripts/test-audio-plugin-cleanup.py
          terminal/zsh/test-config.sh
          terminal/zsh/test-newgig.sh
          terminal/zsh/test-media-stack.sh

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-log
          path: ${{ runner.temp }}/install.log
          if-no-files-found: warn
