# vim: filetype=toml
# ============================================================================
# Yazi Keymap
# ============================================================================
#
# prepend_keymap, not keymap. `keymap = [ ... ]` replaces the default keymap
# outright, and this file used it for all six sections — so it was carrying
# 184 bindings of which 63 were byte-identical restatements of the defaults,
# while 102 defaults it had never mentioned were silently unavailable. Forty-
# five of those were in the input editor alone.
#
# It also meant every upstream rename had to be mirrored here by hand, and
# yazi ignores a binding it cannot parse without saying so, so the ones that
# were missed simply stopped working: `peek` for preview scrolling, `search fd`
# before --via existed, `tasks_show` before it became tasks:show, `copy
# dirname` before dirpath, `--dir_first` on sort, `--confirm` on shell,
# `--state=true` on toggle_all, and the [select] and [completion] sections,
# which are now [pick] and [cmp] and so were being read as nothing at all.
#
# Prepending keeps only what is genuinely different from the defaults, which
# is the list below, and lets the rest arrive from the binary — including the
# next rename. Checked against yazi 26.9.1's own keymap-default.toml.

[mgr]
prepend_keymap = [
	{ on = [ "<C-q>" ],    run = "close", desc = "Close the current tab, or quit if it is last tab" },
	{ on = [ "<C-z>" ],    run = "suspend", desc = "Suspend the process" },
	{ on = [ "<C-u>" ],    run = "arrow -50%", desc = "Move cursor up half page" },
	{ on = [ "<C-d>" ],    run = "arrow 50%", desc = "Move cursor down half page" },
	{ on = [ "<C-b>" ],    run = "arrow -100%", desc = "Move cursor up one page" },
	{ on = [ "<C-f>" ],    run = "arrow 100%", desc = "Move cursor down one page" },
	# `seek`, not `peek`: peek is not a command in this yazi and a
	# binding it cannot parse is silently ignored, so these two keys
	# did nothing at all rather than reporting anything.
	{ on = [ "<A-k>" ],    run = "seek -5", desc = "Scroll the preview up 5 lines" },
	{ on = [ "<A-j>" ],    run = "seek 5", desc = "Scroll the preview down 5 lines" },
	{ on = [ "<Up>" ],     run = "arrow -1", desc = "Move cursor up" },
	{ on = [ "<Down>" ],   run = "arrow 1", desc = "Move cursor down" },
	{ on = [ "<Left>" ],   run = "leave", desc = "Go back to the parent directory" },
	{ on = [ "<Right>" ],  run = "enter", desc = "Enter the child directory" },
	{ on = [ "<Enter>" ],  run = "open", desc = "Open the selected files" },
	{ on = [ "<C-Enter>" ], run = "open --interactive", desc = "Open the selected files interactively" },
	# The chained `escape --visual --select` is what makes these differ from
	# the defaults: the action runs and then the selection is cleared, so a
	# yank or a delete does not leave the marks behind.
	{ on = [ "h" ],        run = [ "leave", "escape --visual --select" ], desc = "Go back to the parent directory" },
	{ on = [ "l" ],        run = "plugin smart-enter", desc = "Enter the child directory, or open the file" },
	{ on = [ "y" ],        run = [ "yank", "escape --visual --select" ], desc = "Copy the selected files" },
	{ on = [ "x" ],        run = [ "yank --cut", "escape --visual --select" ], desc = "Cut the selected files" },
	{ on = [ "d" ],        run = [ "remove", "escape --visual --select" ], desc = "Move the files to the trash" },
	{ on = [ "D" ],        run = [ "remove --permanently", "escape --visual --select" ], desc = "Permanently delete the files" },
	{ on = [ "r" ],        run = "rename", desc = "Rename a file or directory" },
	# K/J jump the cursor five rows. Upstream binds them to `seek`, which is
	# preview scrolling here and lives on <A-k>/<A-j> instead.
	{ on = [ "K" ],        run = "arrow -5", desc = "Move cursor up 5 lines" },
	{ on = [ "J" ],        run = "arrow 5", desc = "Move cursor down 5 lines" },
	# Swapped against upstream: z is the one reached for most, so it gets
	# zoxide rather than fzf.
	{ on = [ "z" ],        run = "plugin zoxide", desc = "Jump to a directory using zoxide" },
	{ on = [ "Z" ],        run = "plugin fzf", desc = "Jump to a directory, or reveal a file using fzf" },
	# A single t creates a tab, where upstream wants tt. That shadows the t
	# prefix, so tab_rename (tr) is unreachable; `tab_rename --interactive`
	# is still available from the command palette.
	{ on = [ "t" ],        run = "tab_create --current", desc = "Create a new tab using the current path" },
	{ on = [ "F" ],        run = 'shell -- open -R "%h"', desc = "Reveal in Finder" },
	{ on = [ "c", "m" ],   run = '''shell 'read -p "chmod: " mode && chmod "$mode" %s' --block''', desc = "Change file permissions" },
	{ on = [ "!" ],        run = 'shell "$SHELL" --block', desc = "Open shell in current directory" },
	# Paths come from the variables zshrc exports, not from literals, so a
	# drive that moves is one edit in terminal/zsh/zshrc and both the shell
	# aliases and these keys follow. yazi expands $VAR and ${VAR} in `cd`.
	#
	# An unset variable is left unexpanded and the key lands in a directory
	# literally named $ARCHIVE, which does not exist — visibly wrong rather
	# than wrong-but-plausible. That matters because zshrc gates the volume
	# variables behind the personal profile, and because yazi inherits the
	# environment of whatever launched it: from a shell these are present,
	# from a GUI launcher they are not.
	#
	# g t keeps /tmp literal, which shadows upstream's `plugin trash`, and
	# g f keeps the FLAC library, which shadows upstream's `follow`.
	{ on = [ "g", "." ],   run = "cd $DOTFILES", desc = "Go to the dotfiles repo" },
	{ on = [ "g", "/" ],   run = "cd /", desc = "Go to the root directory" },
	{ on = [ "g", "t" ],   run = "cd /tmp", desc = "Go to the temporary directory" },
	{ on = [ "g", "i" ],   run = "cd $MOBILE", desc = "Go to iCloud's Mobile Documents" },
	{ on = [ "g", "w" ],   run = "cd $WORK", desc = "Go to the work directory" },
	{ on = [ "g", "a" ],   run = "cd $ARCHIVE", desc = "Go to the Archive volume" },
	{ on = [ "g", "A" ],   run = "cd $AUDIO", desc = "Go to the Audio volume" },
	{ on = [ "g", "M" ],   run = "cd $MEDIA", desc = "Go to the Media volume" },
	{ on = [ "g", "V" ],   run = "cd $VIDEO", desc = "Go to the Video volume" },
	{ on = [ "g", "C" ],   run = "cd $CINEMA", desc = "Go to the film library" },
	{ on = [ "g", "r" ],   run = "cd $DRIVE", desc = "Go to the Drive directory" },
	{ on = [ "g", "f" ],   run = "cd $MUSIC", desc = "Go to the FLAC library" },
	{ on = [ "g", "P" ],   run = "cd $PROJECTS", desc = "Go to the audio projects" },
	{ on = [ "g", "s" ],   run = "cd $SHARED", desc = "Go to the Shared directory" },
	{ on = [ "g", "T" ],   run = "cd $TELEVISION", desc = "Go to the television library" },
]

[tasks]
prepend_keymap = [
	{ on = [ "<Esc>" ],  run = "close", desc = "Hide the task manager" },
	{ on = [ "<C-q>" ],  run = "close", desc = "Hide the task manager" },
	{ on = [ "<Up>" ],   run = "arrow -1", desc = "Move cursor up" },
	{ on = [ "<Down>" ], run = "arrow 1", desc = "Move cursor down" },
	{ on = [ "<Enter>" ], run = "inspect", desc = "Inspect the task" },
]

[input]
prepend_keymap = [
	{ on = [ "<C-q>" ],  run = "close", desc = "Cancel input" },
	{ on = [ "<Enter>" ], run = "close --submit", desc = "Submit the input" },
	{ on = [ "<Esc>" ],  run = "escape", desc = "Go back the normal mode, or cancel input" },
	{ on = [ "<Left>" ], run = "move -1", desc = "Move cursor left" },
	{ on = [ "<Right>" ], run = "move 1", desc = "Move cursor right" },
	{ on = [ "<C-r>" ],  run = "redo", desc = "Redo the last operation" },
	{ on = [ "u" ],      run = "undo", desc = "Undo the last operation" },
]

[help]
prepend_keymap = [
	{ on = [ "<Esc>" ], run = "escape", desc = "Clear the filter, or hide the help" },
	{ on = [ "q" ],     run = "close", desc = "Exit the process" },
	{ on = [ "<C-q>" ], run = "close", desc = "Hide the help" },
	{ on = [ "K" ],     run = "arrow -5", desc = "Move cursor up 5 lines" },
	{ on = [ "J" ],     run = "arrow 5", desc = "Move cursor down 5 lines" },
	{ on = [ "<Up>" ],  run = "arrow -1", desc = "Move cursor up" },
	{ on = [ "<Down>" ], run = "arrow 1", desc = "Move cursor down" },
	{ on = [ "/" ],     run = "filter", desc = "Apply a filter for the help items" },
]

[pick]
prepend_keymap = [
	{ on = [ "<C-q>" ],  run = "close", desc = "Cancel selection" },
	{ on = [ "<Esc>" ],  run = "close", desc = "Cancel selection" },
	{ on = [ "<Enter>" ], run = "close --submit", desc = "Submit the selection" },
	{ on = [ "K" ],      run = "arrow -5", desc = "Move cursor up 5 lines" },
	{ on = [ "J" ],      run = "arrow 5", desc = "Move cursor down 5 lines" },
	{ on = [ "<Up>" ],   run = "arrow -1", desc = "Move cursor up" },
	{ on = [ "<Down>" ], run = "arrow 1", desc = "Move cursor down" },
]

[cmp]
prepend_keymap = [
	{ on = [ "<C-q>" ], run = "close", desc = "Cancel completion" },
	{ on = [ "<Tab>" ], run = "close --submit", desc = "Submit the completion" },
	{ on = [ "<A-k>" ], run = "arrow -1", desc = "Move cursor up" },
	{ on = [ "<A-j>" ], run = "arrow 1", desc = "Move cursor down" },
	{ on = [ "<Up>" ],  run = "arrow -1", desc = "Move cursor up" },
	{ on = [ "<Down>" ], run = "arrow 1", desc = "Move cursor down" },
]
