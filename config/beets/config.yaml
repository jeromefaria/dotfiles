# library: /Volumes/External/Music/FLAC.db
# directory: /Volumes/External/Music/FLAC

library: ~/.config/beets/library.db
directory: /Volumes/Media/Music/FLAC

import:
  write: yes
  copy: yes
  move: no
  link: no
  hardlink: no
  reflink: no
  delete: no
  resume: ask
  incremental: yes
  incremental_skip_later: no
  from_scratch: no
  quiet_fallback: skip
  none_rec_action: ask
  timid: no
  log:
  autotag: yes
  quiet: no
  singletons: no
  default_action: apply
  languages: []
  detail: no
  flat: no
  group_albums: no
  pretend: no
  search_ids: []
  duplicate_action: ask
  bell: no
  set_fields: {}

clutter: [Thumbs.DB, .DS_Store]
ignore:
  - .*
  - "*~"
  - System Volume Information
  - lost+found
ignore_hidden: yes

replace:
  '[\\/]': _
  ^\.: _
  '[\x00-\x1f]': _
  '[<>:"\?\*\|]': _
  \.$: _
  \s+$: ""
  ^\s+: ""
  ^-: _
path_sep_replace: _
drive_sep_replace: _
asciify_paths: no
art_filename: cover
max_filename_length: 0

aunique:
  keys: albumartist album
  disambiguators: albumtype year label catalognum albumdisambig releasegroupdisambig
  bracket: "[]"

overwrite_null:
  album: []
  track: []

plugins: mbretry musicbrainz discogs lastgenre fetchart embedart albumtypes mbsync duplicates missing
pluginpath:
  - /Users/jeromefaria/dotfiles/config/beets/plugins

duplicates:
  format: $albumartist - $album

threaded: no
timeout: 30.0
per_disc_numbering: no
verbose: 0
terminal_encoding:
original_date: no
artist_credit: no
id3v23: no
va_name: Various Artists

ui:
  terminal_width: 80
  length_diff_thresh: 10.0
  color: yes
  colors:
    text_success: green
    text_warning: yellow
    text_error: red
    text_highlight: red
    text_highlight_minor: lightgray
    action_default: turquoise
    action: blue

format_item: $artist - $album - $title
format_album: $albumartist - $album
time_format: "%Y-%m-%d %H:%M:%S"
format_raw_length: no

sort_album: albumartist+ album+
sort_item: artist+ album+ disc+ track+
sort_case_insensitive: yes

paths:
  default: $albumartist - $album%aunique{}/$track $title
  singleton: Non-Album/$artist/$title
  comp: Compilations/$album%aunique{}/$track $title

statefile: state.pickle

musicbrainz:
  host: musicbrainz.org
  https: yes
  ratelimit: 1
  ratelimit_interval: 10.0
  searchlimit: 5
  extra_tags: []
  genres: no
  data_source_mismatch_penalty: 0.0

mbretry:
  max_retries: 3              # Maximum retry attempts
  initial_delay: 5            # Initial delay in seconds (respects 10s rate limit)
  max_delay: 60               # Maximum delay between retries
  backoff_strategy: exponential  # exponential, linear, or fixed
  backoff_multiplier: 2       # Exponential backoff multiplier
  jitter: true                # Add random jitter to delays
  jitter_range: 0.1           # Jitter as ±10% of delay
  retry_on_errors:            # Error types to retry
    - NetworkError
    - ResponseError
    - WebServiceError
    - timeout
  log_retries: true           # Log retry attempts
  log_level: info             # debug, info, or warning
  respect_ratelimit: true     # Honor existing rate limits

discogs:
  user_token: WrEezFeLsPOOVbdUtnpEQRXWAWuXLbNZqtEJsxnC

match:
  strong_rec_thresh: 0.04
  medium_rec_thresh: 0.25
  rec_gap_thresh: 0.25
  max_rec:
    missing_tracks: medium
    unmatched_tracks: medium
  distance_weights:
    source: 2.0
    artist: 3.0
    album: 3.0
    media: 1.0
    mediums: 1.0
    year: 1.0
    country: 0.5
    label: 0.5
    catalognum: 0.5
    albumdisambig: 0.5
    album_id: 5.0
    tracks: 2.0
    missing_tracks: 0.9
    unmatched_tracks: 0.6
    track_title: 3.0
    track_artist: 2.0
    track_index: 1.0
    track_length: 2.0
    track_id: 5.0
  preferred:
    countries: []
    media: []
    original_year: no
  ignored: []
  required: []
  ignored_media: []
  ignore_data_tracks: yes
  ignore_video_tracks: yes
  track_length_grace: 10
  track_length_max: 30

albumtypes:
  types:
    - ep: "EP"
    - single: "Single"
    - soundtrack: "OST"
    - live: "Live"
    - compilation: "Anthology"
    - remix: "Remix"
  ignore_va: compilation
  bracket: "[]"
