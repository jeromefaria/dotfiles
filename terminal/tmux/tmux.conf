# Change default prefix key to ctrl + a
# set-option -g prefix C-a

# Window and pane numbering starts at 1 (not 0)
set -g base-index 1
set -g pane-base-index 1

# Close gaps when windows are closed (1,3,4 → 1,2,3)
set -g renumber-windows on

# thanks to PCKeyboardHack, F10 is caps lock and caps lock is F10
set-option -g prefix F12

# go to last window by hitting caps lock two times in rapid succession
bind-key F12 last-window

# Note: reattach-to-user-namespace is no longer needed on macOS 10.14+
set-option -g default-command "$SHELL"

# Enable vi mode for shell
setw -g mode-keys vi

# enable utf-8 on status bar
set -g status on

# Status bar styling (OceanicNext theme)
# Colors: bg=#1B2B34, fg=#D8DEE9, cyan=#6699CC, green=#99C794, yellow=#FAC863
set -g status-style 'bg=#1B2B34 fg=#D8DEE9'
set -g status-left-length 40
set -g status-right-length 120
set -g status-left '#[fg=#1B2B34,bg=#6699CC,bold] #S #[fg=#6699CC,bg=#1B2B34]'
set -g status-right '#{prefix_highlight} #[fg=#D8DEE9,bg=#1B2B34]#(~/.tmux/musikcube-now-playing.sh) #[fg=#343D46,bg=#1B2B34]#[fg=#D8DEE9,bg=#343D46] %Y-%m-%d  %H:%M #[fg=#99C794,bg=#343D46]#[fg=#1B2B34,bg=#99C794,bold] #h '
setw -g window-status-format '#[fg=#A7ADBA,bg=#1B2B34] #I #W '
setw -g window-status-current-format '#[fg=#1B2B34,bg=#343D46]#[fg=#D8DEE9,bg=#343D46,bold] #I #W #[fg=#343D46,bg=#1B2B34]'
set -g window-status-separator ''
set -g pane-border-style 'fg=#343D46'
set -g pane-active-border-style 'fg=#6699CC'
set -g message-style 'bg=#343D46 fg=#D8DEE9'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-urlview'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'alexwforsythe/tmux-which-key'

# Enhanced workflow plugins
set -g @plugin 'sainnhe/tmux-fzf'              # FZF integration for tmux
set -g @plugin 'fcsonline/tmux-thumbs'         # Fast text selection with hints
set -g @plugin 'laktak/extrakto'               # FZF-based text extraction (alternative to thumbs)
set -g @plugin 'tmux-plugins/tmux-yank'        # Enhanced clipboard integration
set -g @plugin 'tmux-plugins/tmux-prefix-highlight' # Visual prefix indicator
set -g @plugin 'tmux-plugins/tmux-sessionist'  # Session management helpers

set -g @open-S 'https://www.duckduckgo.com/'

# ─────────────────────────────────────────────────────────────────────────────
# Plugin configurations
# ─────────────────────────────────────────────────────────────────────────────

# tmux-fzf: Launch with prefix + f
TMUX_FZF_LAUNCH_KEY="f"
set -g @tmux-fzf-launch-key "f"

# tmux-thumbs: Launch with prefix + a (hint-mode text selection)
set -g @thumbs-key a

# extrakto: Launch with prefix + e (FZF-based text extraction, alternative to thumbs)
set -g @extrakto_key e
set -g @extrakto_grab_area "full"
set -g @extrakto_fzf_tool "fzf"

# tmux-prefix-highlight: Show in status bar
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=#1B2B34,bg=#FAC863,bold'
set -g @prefix_highlight_prefix_prompt 'PREFIX'
set -g @prefix_highlight_copy_prompt 'COPY'

# tmux-sessionist key bindings (all use prefix + g by default)
# prefix + g - prompts for session name and switches to it
# prefix + C (shift + c) - prompt for creating a new session
# prefix + X (shift + x) - kill current session without detaching tmux
# prefix + S (shift + s) - switch to the last session
# prefix + @ - promote current pane into a new session

# Key bindings to resize panes
bind j resize-pane -D 10
bind k resize-pane -U 10
bind h resize-pane -L 10
bind l resize-pane -R 10

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# True color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,ghostty:Tc"

# Mouse support
set -g mouse on

# Enable focus events for better editor integration (autoread in Neovim)
set -g focus-events on

# Restore pane contents
set -g @resurrect-capture-pane-contents 'on'

# Auto-save and restore sessions
# Disabled: conflicts with tmuxinator which manages session layouts
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

# Copy mode bindings (vim style)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Update default binding of `Enter` to also use copy-pipe
# unbind -T copy-mode-vi send-keys -X Enter
# bind-key -T copy-mode-vi send-keys -X Enter copy-pipe "reattach-to-user-namespace pbcopy"

# Prevent window renaming
set-option -g allow-rename off

# Vim/Tmux navigator
# Smart pane switching with awareness of vim splits (also handles fzf)
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
# bind -n C-\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# Move window bindings (keep focus on moved window)
bind-key -n S-Left swap-window -t -1\; select-window -t -1
bind-key -n S-Right swap-window -t +1\; select-window -t +1

# Kill server
bind Q kill-server

# Command history
set -g history-file ~/.tmux_history

# ─────────────────────────────────────────────────────────────────────────────
# Productivity keybindings
# ─────────────────────────────────────────────────────────────────────────────

# Synchronize panes (broadcast input to all panes)
# NOTE: This must be after plugin loading to avoid being overridden by tmux-sessionist
# bind S setw synchronize-panes\; display "Sync #{?pane_synchronized,ON,OFF}"

# Splits that preserve current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in current directory
bind C new-window -c "#{pane_current_path}"

# Quick session/window selection with tree view
bind s choose-tree -Zs
bind w choose-tree -Zw

# Join pane from another window / break pane to new window
bind J command-prompt -p "join pane from:" "join-pane -s '%%'"
bind B break-pane

# Clear pane history and screen
bind C-k send-keys -R \; clear-history \; display "Cleared"

# Toggle status bar visibility
bind b set-option -g status

# Quick layout switching
bind M-1 select-layout even-horizontal
bind M-2 select-layout even-vertical
bind M-3 select-layout main-horizontal
bind M-4 select-layout main-vertical
bind M-5 select-layout tiled

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Rebind after plugins to override tmux-sessionist's 'prefix + S' binding
bind S setw synchronize-panes\; display "Sync #{?pane_synchronized,ON,OFF}"
