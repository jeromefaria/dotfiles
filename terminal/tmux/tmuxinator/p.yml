name: Personal
root: ~
windows:
  - files:
      pre: cd ~
      layout: even-vertical
      panes:
        - yazi
        - clear
  - dotfiles:
      pre: cd ~/dotfiles
      layout: main-horizontal
      panes:
        - nvim
        - clear
  - email:
      pre: cd ~
      panes:
        - neomutt
  - transfer:
      pre: cd ~
      layout: even-vertical
      panes:
        - clear
        - clear
  - music:
      pre: cd ~
      panes:
        - musikcube
        - "if test -d /Volumes/Media/Music/FLAC/; then nicotine; else echo 'Music library not available'; fi"
  - audio:
      pre: cd /Volumes/Audio/Audio
      panes:
        - claude --dangerously-skip-permissions --continue
