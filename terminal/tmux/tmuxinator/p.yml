name: Personal
root: /Users/jeromefaria
windows:
  - files:
      pre: cd ~
      layout: even-vertical
      panes:
        - yazi
        - clear
  - dotfiles:
      pre: cd ~/dotfiles
      layout: main-horizontal
      panes:
        - nvim
        - clear
  - email:
      pre: cd ~
      panes:
        - neomutt
  - transfer:
      pre: cd ~
      layout: even-vertical
      panes:
        - clear
        - clear
  - music:
      pre: cd ~
      panes:
        - musikcube
        - "if [ -d /Volumes/Media/Music/FLAC/ ]; then nicotine; else echo 'Music library not available'; fi"
  - code:
      pre: cd "${WORK_PROJECT_BASE:-$HOME/Code}"
      layout: 4cd7,255x64,0,0[255x51,0,0{127x51,0,0,6,127x51,128,0,11},255x12,0,52{127x12,0,52,12,127x12,128,52,13}]
      panes:
        - nvim
        - sel && claude --dangerously-skip-permissions --continue
        - clear
        - clear
  - audio:
      pre: cd /Volumes/Audio/Audio
      panes:
        - claude --dangerously-skip-permissions --continue
