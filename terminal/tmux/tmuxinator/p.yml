name: Personal
root: ~/
windows:
  - files:
      layout: even-vertical
      panes:
        - yazi
        - clear
  - dotfiles:
      pre: cd ~/dotfiles
      layout: main-horizontal
      panes:
        - nvim
        - clear
  - email:
      panes:
        - neomutt
  - transfer:
      layout: even-vertical
      panes:
        - clear
        - clear
  - music:
      panes:
        - musikcube
        - if [ -d /Volumes/Media/Music/FLAC/ ]; then nicotine; else echo "Music library not available"; fi
  - code:
      pre: cd ~/Work
      layout: tiled
      panes:
        - nvim
        - clear
        - clear
        - clear
